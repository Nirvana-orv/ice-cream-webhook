<!DOCTYPE html>
<html>
<head>
  <title>Ice Cream Ordering AI 🍦</title>
</head>
<body>
  <h1>Chat with Me 🤖</h1>

  <div id="chat-box" style="border:1px solid #ccc; height:400px; width:350px; overflow-y:auto; padding:10px;">
    <div><b>Bot:</b> Hi! I’m here to chat 😊</div>
  </div>

  <input id="user-input" type="text" placeholder="Type a message..." style="width:260px;">
  <button onclick="sendMessage()">Send</button>

  <script>
    function sendMessage() {
      const input = document.getElementById("user-input");
      const chatBox = document.getElementById("chat-box");

      const userText = input.value;
      if (!userText) return;

      chatBox.innerHTML += `<div><b>You:</b> ${userText}</div>`;
      input.value = "";

      fetch("https://ice-cream-webhook.onrender.com/webhook", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    query: userText
  })
})
.then(response => response.json())
.then(data => {
  chatBox.innerHTML += `<div><b>Bot:</b> ${data.reply}</div>`;
  chatBox.scrollTop = chatBox.scrollHeight;
})
.catch(error => {
  chatBox.innerHTML += `<div><b>Bot:</b> Oops, something went wrong 😅</div>`;
});
    }
  </script>
</body>
</html>
