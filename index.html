<!DOCTYPE html>
<html>
<head>
  <title>ScoopBot 🍦</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #fdfbfb, #ebedee);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      background: white;
      width: 420px;
      height: 600px;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    .header {
      background: #ff8c42;
      color: white;
      padding: 14px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .chat-box {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      background: #fafafa;
    }

    .message {
      margin: 8px 0;
      padding: 10px 14px;
      border-radius: 14px;
      max-width: 80%;
      line-height: 1.4;
      white-space: pre-line;
    }

    .user {
      background: #007bff;
      color: white;
      margin-left: auto;
    }

    .bot {
      background: #e5e5ea;
      color: black;
      margin-right: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 0.9rem;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: center;
    }

    th {
      background: #ffe0c3;
    }

    .input-area {
      display: flex;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      font-size: 1rem;
    }

    button {
      padding: 14px 18px;
      border: none;
      background: #ff8c42;
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background: #ff7a22;
    }
  </style>
</head>

<body>

<div class="chat-container">
  <div class="header">ScoopBot 🍨</div>

  <div class="chat-box" id="chat-box">
    <div class="message bot">
      <strong>Welcome! Here’s our menu 🍦</strong>

      <table>
        <tr>
          <th>Size</th>
          <th>Price</th>
        </tr>
        <tr><td>Small</td><td>₹60</td></tr>
        <tr><td>Medium</td><td>₹80</td></tr>
        <tr><td>Large</td><td>₹100</td></tr>
      </table>

      <br>

      <table>
        <tr>
          <th>Flavors</th>
          <th>Toppings (+₹20)</th>
        </tr>
        <tr>
          <td>Vanilla</td>
          <td>Sprinkles</td>
        </tr>
        <tr>
          <td>Chocolate</td>
          <td>Choco Chips</td>
        </tr>
        <tr>
          <td>Strawberry</td>
          <td>Nuts</td>
        </tr>
        <tr>
          <td>Mango</td>
          <td>Caramel</td>
        </tr>
        <tr>
          <td>Butterscotch</td>
          <td>—</td>
        </tr>
      </table>

      <br>
      Try: <em>“Large chocolate with sprinkles”</em>
    </div>
  </div>

  <div class="input-area">
    <input id="user-input" type="text" placeholder="Type your order..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("user-input");
  const chatBox = document.getElementById("chat-box");
  const text = input.value.trim();
  if (!text) return;

  chatBox.innerHTML += `<div class="message user">${text}</div>`;
  input.value = "";

  fetch("https://ice-cream-webhook.onrender.com/webhook", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query: text })
  })
  .then(res => res.json())
  .then(data => {
    chatBox.innerHTML += `<div class="message bot">${data.reply}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  })
  .catch(() => {
    chatBox.innerHTML += `<div class="message bot">Server error 😅</div>`;
  });
}
</script>

</body>
</html>
